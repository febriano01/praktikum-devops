services:
  app:
    build: .
    image: sentra:1.0.0
    ports:
      - "5000"
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:5000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - sentra-net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - sentra-net

volumes:
  redis-data:

networks:
  sentra-net:
